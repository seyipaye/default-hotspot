<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <title>Internet hotspot - Log out</title>
    <link rel="stylesheet" href="css/style.css">
    <script>
        function openLogin() {
            if (window.name != 'hotspot_logout') return true;
            open('$(link-login)', '_self', '');
            window.close();
            return false;
        }
        // Read URL parameters for username, password, and dst
        document.addEventListener('DOMContentLoaded', function () {
            const urlParams = new URLSearchParams(window.location.search);
            const username = urlParams.get('username');
            const password = urlParams.get('password');
            const dst = urlParams.get('dst');

            console.log('URL Parameters detected:', {
                username: username,
                password: password ? '***hidden***' : 'not provided',
                dst: dst
            });

            // Auto-initiate login if username and password are present
            if (username && password) {
                console.log('Auto-initiating login with provided credentials');

                // Build login URL with parameters
                const loginUrl = new URL('$(link-login)', window.location.origin);
                loginUrl.searchParams.set('username', username);
                loginUrl.searchParams.set('password', password);
                if (dst) {
                    loginUrl.searchParams.set('dst', dst);
                }

                // Redirect to login page with parameters
                window.open(loginUrl.toString(), '_self');
                // window.location.href = loginUrl.toString();
            }
        });
    </script>
</head>

<body>
    <div class="ie-fixMinHeight">
        <div class="main">
            <div class="wrap">
                <h1>You have just logged out!</h1>
                <table>
                    <tr>
                        <td>Username</td>
                        <td>$(username)</td>
                    </tr>
                    <tr>
                        <td>IP address</td>
                        <td>$(ip)</td>
                    </tr>
                    <tr>
                        <td>MAC address</td>
                        <td>$(mac)</td>
                    </tr>
                    <tr>
                        <td>Session time</td>
                        <td>$(uptime)</td>
                    </tr>
                    $(if session-time-left)
                    <tr>
                        <td>Time left</td>
                        <td>$(session-time-left)</td>
                    </tr>
                    $(endif)
                    <tr>
                        <td>Bytes up / down:</td>
                        <td>$(bytes-in-nice) / $(bytes-out-nice)</td>
                    </tr>
                </table>


                <form action="$(link-login)" name="login" onSubmit="return openLogin()">
                    <input type="submit" value="Log in">
                </form>
            </div>
        </div>
    </div>

</body>

</html>
