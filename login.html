<body>

  <!-- two other colors

  $(if chap-id)
  <form name="sendin" action="$(link-login-only)" method="post" style="display:none">
    <input type="hidden" name="username" />
    <input type="hidden" name="password" />
    <!-- <input type="hidden" name="dst" value="$(link-orig)" /> -->
    <input type="hidden" name="dst" value="https://usefastlink.com" />
    <input type="hidden" name="popup" value="false" />
  </form>

  <script src="/md5.js"></script>
  <script>

    // Check if username and password are stored in localStorage
    const storedUsername = localStorage.getItem('username');
    const storedPassword = localStorage.getItem('password');

    // Pre-fill email field
    document.addEventListener('DOMContentLoaded', function () {
      // Only works on PC

      // Check if both values exist
      if (storedUsername && storedPassword) {
        // Populate the login form fields with the stored values

        console.log(storedUsername + '...' + storedPassword + 'Chap' + '$(chap-id)' + 'eeee' + '$(chap-challenge)');
        document.getElementById("email").value = storedUsername;
        document.getElementById("password").value = storedPassword;
      }
    });

    function doLogin() {
      document.sendin.username.value = document.login.username.value;
      document.sendin.password.value = hexMD5('$(chap-id)' + document.login.password.value + '$(chap-challenge)');
      document.sendin.submit();

      // Store the username and password in localStorage if "Remember Me" is checked
      if (document.login.rememberMe.checked) {
        localStorage.setItem('username', document.login.username.value);
        localStorage.setItem('password', document.login.password.value);
        console.log('Saved ' + document.login.username.value + ' ' + document.login.password.value)
      } else {
        // If "Remember Me" is not checked, remove any previously stored values
        localStorage.removeItem('username');
        localStorage.removeItem('password');
      }

      return false;
    }

  </script>
  $(endif)
  <script>
    let baseUrl = 'https://portal.usefastlink.com';

    function handleAndroidNavigation(event, destinationUrl) {
      event.preventDefault();
      const isAndroid = /Android/i.test(navigator.userAgent);

      if (isAndroid) {
        // Remove https:// and add intent scheme for Android
        const intentUrl = `intent://${destinationUrl.replace('https://', '')}#Intent;scheme=https;package=com.android.chrome;end`;
        window.open(intentUrl, '_self');
      } else {
        window.open(destinationUrl, '_self');
      }
    }

    document.addEventListener('DOMContentLoaded', function () {
      // Handle Register button
      const registerButton = document.querySelector('.register-button a');
      registerButton.addEventListener('click', (e) => {
        handleAndroidNavigation(e, baseUrl + '/signup');
      });

      // Handle User Portal link
      const userPortalLink = document.getElementById('user-portal-link');
      userPortalLink.addEventListener('click', (e) => {
        handleAndroidNavigation(e, baseUrl + '/home');
      });

      // Handle Buy Data link
      const buyDataLink = document.getElementById('buy-data-link');
      buyDataLink.addEventListener('click', (e) => {
        handleAndroidNavigation(e, baseUrl);
      });
    });
  </script>
  <div class="ie-fixMinHeight">
    <div class="main">
      <div class="wrap animated fadeIn">
        <form name="login" action="$(link-login-only)" method="post" $(if chap-id) onSubmit="return doLogin()" $(endif)>
          <!-- <input type="hidden" name="dst" value="$(link-orig)" /> -->
          <input type="hidden" name="dst" value="https://usefastlink.com" />
          <input type="hidden" name="popup" value="false" />
          <img src="img/fastlink_logo_black.png" alt="fastlink-logo"
            style="height: auto; width: 200px; display: block; margin: 0 auto; padding: 30px" />

          <p class="info $(if error)alert$(endif)">
            $(if error == "")Please log in to use the internet hotspot $(if trial == 'yes')<br />Free trial
            available, <a href="$(link-login-only)?dst=$(link-orig-esc)&amp;username=T-$(mac-esc)">click
              here</a>.$(endif)
            $(endif)

            $(if error)$(error)$(endif)
          </p>
          <label>
            <img class="ico" src="img/user.svg" alt="#" />
            <input id="email" name="username" type="text" value="$(username)" placeholder="Username or Email address" />
          </label>

          <label>
            <img class="ico" src="img/password.svg" alt="#" />
            <input id="password" name="password" type="password" placeholder="Password" style="margin-bottom: 10px;" />
          </label>

          <!-- Add the "Remember Me" checkbox -->
          <label>
            <input type="checkbox" id="checkbox" name="rememberMe" checked="true" /> Remember Me
          </label>

          <input type="submit" value="Connect" style="margin-top: 20px" />
          <!-- <input type="register" value="Register"> </input> -->

          <button class="register-button">
            <a style="display: block; color:#E0371D; text-decoration: none">Register</a></button>
        </form>

        <footer>
          <!-- <a href="/buy-data.html">Buy or Claim Free Data</a> -->
          <!-- <a href="intent://portal.usefastlink.com#Intent;scheme=https;package=com.android.chrome;end">Out of Data? Buy data here</a> -->
          <!-- <a href="intent://portal.usefastlink.com#Intent;scheme=https;end">Out of Data? Buy data here</a> -->
          <!-- <a href="https://portal.usefastlink.com" target="_blank" rel="noopener noreferrer">Outtt of Data? Buy data here</a> Doesn't work on iOS and Android -->
          <!-- <a href="intent://usefastlink.com#Intent;scheme=https;S.browser_fallback_url=https%3A%2F%2Fusefastlink.com;end">Outa of Data? Buy data here</a> -->
          <a id="buy-data-link" href="#">Out of Data? Buy data here</a>
        </footer>
        <footer style="margin-top: 5px;">
          <a href="https://seyipaye.notion.site/FastLink-Data-Plan-eb10d6cf7ada447390f8023024b3c192">Pricing</a>
          <a id="user-portal-link" href="#">User Portal</a>
          <a href="sms:2348168706767">Contact us</a>
        </footer>
